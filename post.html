<head>

  <style>
    :root {
      --color-bg:#fdf9f3;--color-primary:#154212;--color-primary-light:#1e5c18;
      --color-accent:#9f402d;--color-text:#2c2c2a;--color-text-muted:#6b6b66;
      --color-border:#e8e2d8;--font-heading:'Newsreader',Georgia,serif;
      --font-body:'Plus Jakarta Sans',system-ui,sans-serif;--max-width:680px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{font-size:16px;scroll-behavior:smooth}
    body{font-family:var(--font-body);background:var(--color-bg);color:var(--color-text);line-height:1.75;-webkit-font-smoothing:antialiased}
    a{color:var(--color-primary);text-decoration:none}a:hover{text-decoration:underline}
    .site-header{border-bottom:1px solid var(--color-border);background:var(--color-bg);position:sticky;top:0;z-index:10}
    .site-header-inner{max-width:960px;margin:0 auto;padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between}
    .site-logo{font-family:var(--font-heading);font-size:1.25rem;font-weight:500;color:var(--color-primary);letter-spacing:-.01em}
    .site-logo span{color:var(--color-accent)}
    .site-nav{display:flex;gap:1.5rem;align-items:center}
    .site-nav a{font-size:.875rem;color:var(--color-text-muted);font-weight:500;transition:color .2s}
    .site-nav a:hover{color:var(--color-primary);text-decoration:none}
    .nav-cta{background:var(--color-primary)!important;color:#fff!important;padding:.5rem 1rem;border-radius:6px;font-weight:600;font-size:.8125rem}
    .nav-cta:hover{background:var(--color-primary-light)!important}
    .article-wrapper{max-width:var(--max-width);margin:0 auto;padding:3rem 1.5rem 4rem}
    .article-meta{display:flex;align-items:center;gap:.75rem;margin-bottom:1.5rem;font-size:.8125rem;color:var(--color-text-muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
    .article-meta .dot{color:var(--color-border)}.article-category{color:var(--color-accent)}
    article h1{font-family:var(--font-heading);font-size:clamp(1.75rem,4vw,2.375rem);font-weight:500;line-height:1.25;color:var(--color-primary);margin-bottom:1.5rem;letter-spacing:-.02em}
    article h2{font-family:var(--font-heading);font-size:1.375rem;font-weight:500;color:var(--color-primary);margin:2.5rem 0 .75rem;line-height:1.3}
    article p{margin-bottom:1.25rem;font-size:1.0625rem;line-height:1.8}
    article strong{color:var(--color-primary);font-weight:600}
    article ul,article ol{margin:0 0 1.25rem 1.5rem;font-size:1.0625rem;line-height:1.8}
    article li{margin-bottom:.5rem}
    article img.hero-image{width:100%;border-radius:12px;margin-bottom:2rem;aspect-ratio:16/9;object-fit:cover;display:block}
    .tip-number{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;background:var(--color-primary);color:#fff;font-family:var(--font-heading);font-size:1rem;font-weight:700;border-radius:50%;margin-right:.6rem;flex-shrink:0;vertical-align:middle}
    .tip-heading{display:flex;align-items:center;gap:.5rem;margin:2.5rem 0 .75rem}.tip-heading h2{margin:0}
    .cta-card{background:var(--color-primary);color:#fff;border-radius:12px;padding:2rem 2rem 2.25rem;margin:3rem 0 2rem;text-align:center}
    .cta-card p{font-size:1.0625rem;line-height:1.6;margin-bottom:1.25rem;color:rgba(255,255,255,.9)}
    .cta-button{display:inline-block;background:#fff;color:var(--color-primary);font-family:var(--font-body);font-weight:600;font-size:.9375rem;padding:.75rem 2rem;border-radius:8px;text-decoration:none;transition:transform .15s,box-shadow .15s}
    .cta-button:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.15);text-decoration:none}
    .post-missing{max-width:var(--max-width);margin:0 auto;padding:4rem 1.5rem;text-align:center}
    .post-missing h1{font-family:var(--font-heading);font-weight:500;color:var(--color-primary);margin-bottom:.75rem}
    .post-missing p{color:var(--color-text-muted);margin-bottom:1.5rem}
    .site-footer{border-top:1px solid var(--color-border);background:var(--color-bg)}
    .site-footer-inner{max-width:960px;margin:0 auto;padding:2rem 1.5rem;display:flex;align-items:center;justify-content:space-between;font-size:.8125rem;color:var(--color-text-muted)}
    .footer-links{display:flex;gap:1.5rem}.footer-links a{color:var(--color-text-muted)}.footer-links a:hover{color:var(--color-primary);text-decoration:none}
    @media(max-width:640px){.site-nav .nav-link{display:none}.article-wrapper{padding:2rem 1.25rem 3rem}.cta-card{padding:1.5rem}.site-footer-inner{flex-direction:column;gap:.75rem;text-align:center}}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a href="/" class="site-logo">Cozy<span>Grow</span></a>
      <nav class="site-nav">
        <a href="/" class="nav-link">Home</a>
        <a href="/tips" class="nav-link">Tips</a>
        <a href="https://www.mygardenplanner.app/" class="nav-cta">Open Garden Planner</a>
      </nav>
    </div>
  </header>

  <main class="article-wrapper" data-post-page>
    <div class="article-meta">
      <span class="article-category" data-post-category>Gardening Tips</span>
      <span class="dot">&middot;</span>
      <span data-post-read></span>
    </div>
    <article>
      <h1 data-post-title></h1>
      <img class="hero-image" data-post-image src="" alt="" loading="eager">
      <div data-post-body></div>
    </article>
  </main>

  <main class="post-missing" data-post-not-found hidden>
    <h1>Article not found</h1>
    <p>This post may have moved or has not been published yet.</p>
    <a href="/tips" class="nav-cta">View all tips</a>
  </main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <span>&copy; 2026 CozyGrow Garden. All rights reserved.</span>
      <div class="footer-links">
        <a href="/tips">All Tips</a>
        <a href="/imprint">Imprint</a>
        <a href="/privacy">Privacy</a>
        <a href="https://www.mygardenplanner.app/">Garden Planner App</a>
      </div>
    </div>
  </footer>
  <script src="/blog.js"></script>
</body>
</html>
